<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Architecture: one EC2 machine provisioned by Terraform</text>

  <!-- Laptop -->
  <rect x="24" y="70" width="230" height="400" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="139" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">My laptop (Windows)</text>
  <rect x="44" y="116" width="190" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="139" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Terraform</text>
  <text x="139" y="162" text-anchor="middle" font-size="12" fill="#4c1d95">init · apply · destroy</text>
  <rect x="44" y="192" width="190" height="62" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="139" y="217" text-anchor="middle" font-size="14" font-weight="600" fill="#075985">SSH client</text>
  <text x="139" y="238" text-anchor="middle" font-size="12" fill="#075985">ssh -i key.pem ubuntu@IP</text>
  <rect x="44" y="268" width="190" height="62" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="139" y="293" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">Browser</text>
  <text x="139" y="314" text-anchor="middle" font-size="12" fill="#78350f">http://PUBLIC_IP:8080</text>
  <rect x="44" y="344" width="190" height="106" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="139" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Docker + buildx</text>
  <text x="139" y="390" text-anchor="middle" font-size="12" fill="#1e3a8a">build · run locally</text>
  <text x="139" y="408" text-anchor="middle" font-size="12" fill="#1e3a8a">push amd64 + arm64</text>
  <text x="139" y="426" text-anchor="middle" font-size="12" fill="#1e3a8a">to Docker Hub</text>

  <!-- AWS -->
  <rect x="330" y="70" width="606" height="400" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="352" y="98" font-size="16" font-weight="700" fill="#9a3412">AWS · us-east-1</text>
  <rect x="352" y="114" width="562" height="340" rx="10" fill="#ffffff" stroke="#fb923c" stroke-dasharray="6 4"/>
  <text x="370" y="138" font-size="13" font-weight="600" fill="#9a3412">Default VPC</text>

  <!-- SG -->
  <rect x="372" y="152" width="522" height="286" rx="10" fill="#fef2f2" stroke="#ef4444"/>
  <text x="390" y="175" font-size="13" font-weight="600" fill="#991b1b">Security group "flask-manual-vm"</text>
  <text x="390" y="194" font-size="12" fill="#991b1b">inbound: 22/tcp (SSH), 8080/tcp (Flask) · outbound: all</text>

  <!-- EC2 -->
  <rect x="392" y="208" width="310" height="214" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="547" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">EC2 "flask-manual-vm"</text>
  <text x="547" y="252" text-anchor="middle" font-size="12" fill="#78350f">Ubuntu 26.04 · m5.large · 30 GB gp3</text>
  <rect x="410" y="266" width="274" height="44" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="547" y="285" text-anchor="middle" font-size="12" fill="#1c1917">user_data = bootstrap.sh (first boot)</text>
  <text x="547" y="301" text-anchor="middle" font-size="12" fill="#1c1917">installs git only</text>
  <rect x="410" y="320" width="274" height="86" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="547" y="341" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">Installed by hand (01-manual-deploy-ec2.sh)</text>
  <text x="547" y="360" text-anchor="middle" font-size="12" fill="#065f46">python3-venv → venv → Flask 3.1.3</text>
  <text x="547" y="378" text-anchor="middle" font-size="12" fill="#065f46">python3 app.py  :8080</text>
  <text x="547" y="396" text-anchor="middle" font-size="12" fill="#065f46">→ "Welcome! Flask is running."</text>

  <!-- IAM -->
  <rect x="722" y="208" width="156" height="102" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="800" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">IAM instance profile</text>
  <text x="800" y="252" text-anchor="middle" font-size="12" fill="#14532d">existing IAM role</text>
  <text x="800" y="270" text-anchor="middle" font-size="12" fill="#14532d">(no keys on disk)</text>
  <text x="800" y="292" text-anchor="middle" font-size="11" fill="#14532d">temp creds via IMDSv2</text>
  <line x1="722" y1="259" x2="704" y2="259" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="722" y="324" width="156" height="98" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="800" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Outputs</text>
  <text x="800" y="368" text-anchor="middle" font-size="12" fill="#334155">public_ip</text>
  <text x="800" y="386" text-anchor="middle" font-size="12" fill="#334155">private_ip</text>
  <text x="800" y="404" text-anchor="middle" font-size="12" fill="#334155">app_url</text>

  <!-- arrows -->
  <path d="M234,147 C300,147 300,230 390,230" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="138" font-size="11" fill="#6d28d9">provisions</text>
  <path d="M234,223 C300,223 310,288 408,288" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="216" font-size="11" fill="#0369a1">port 22</text>
  <path d="M234,299 C310,299 320,376 408,376" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="292" font-size="11" fill="#b45309">port 8080</text>

  <text x="480" y="500" text-anchor="middle" font-size="12" fill="#64748b">Everything on the right is created by terraform apply and removed by terraform destroy.</text>
</svg>
